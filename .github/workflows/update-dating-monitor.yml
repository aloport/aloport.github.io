name: Update Dating Monitor

on:
  schedule:
    # Every 6 hours: midnight, 6am, noon, 6pm UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update-monitor:
    runs-on: ubuntu-latest
    env:
      QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests

      - name: Download survey data
        run: python dating-monitor/src/download_data.py

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev \
            libjpeg-dev libharfbuzz-dev libfribidi-dev

      - name: Install R packages
        run: |
          Rscript -e '
            install.packages(c(
              "tidyverse", "cregg", "ggdist", "gridExtra", "patchwork",
              "gt", "janitor", "lubridate", "scales", "ragg"
            ), repos = "https://cloud.r-project.org")
          '

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render dashboard
        run: |
          cd dating-monitor/src
          quarto render fieldwork_monitor.qmd

      - name: Prepare output
        run: |
          # Add Jekyll front-matter so GitHub Pages serves it raw
          {
            echo "---"
            echo "layout: null"
            echo "---"
            cat dating-monitor/src/fieldwork_monitor.html
          } > dating-monitor/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dating-monitor/index.html
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update dating monitor ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
