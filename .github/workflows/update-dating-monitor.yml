name: Update Dating Monitor

on:
  schedule:
    # Every 30 minutes (auto-expires after 2026-03-22)
    - cron: "*/30 * * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update-monitor:
    runs-on: ubuntu-latest
    env:
      QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}

    steps:
      - name: Check expiry date
        if: github.event_name == 'schedule'
        run: |
          # Stop scheduled runs after Sunday March 22, 2026
          if [ "$(date -u +%Y%m%d)" -gt "20260322" ]; then
            echo "Schedule expired (past 2026-03-22). Skipping."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests

      - name: Download survey data
        run: python dating-monitor/src/download_data.py

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev \
            libjpeg-dev libharfbuzz-dev libfribidi-dev

      - name: Install R packages
        run: |
          Rscript -e '
            install.packages(c(
              "tidyverse", "cregg", "ggdist", "gridExtra", "patchwork",
              "gt", "janitor", "lubridate", "scales", "ragg"
            ), repos = "https://cloud.r-project.org")
          '

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render dashboard
        run: |
          cd dating-monitor/src
          quarto render fieldwork_monitor.qmd

      - name: Prepare output
        run: |
          # Add Jekyll front-matter so GitHub Pages serves it raw
          {
            echo "---"
            echo "layout: null"
            echo "---"
            cat dating-monitor/src/fieldwork_monitor.html
          } > dating-monitor/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dating-monitor/index.html
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update dating monitor ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
